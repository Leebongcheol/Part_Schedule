<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="파트 스케줄표 - 팀 일정관리 웹 애플리케이션">
    <title>파트 스케줄표</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===== Header ===== -->
    <header class="app-header">
        <h1 class="app-title">파트 스케줄표</h1>
        <nav class="week-navigation">
            <button type="button" id="btn-prev-week" class="nav-btn" aria-label="이전 주">&#9664; 이전 주</button>
            <span id="current-week-label" class="current-week-label">2026년 8월 2주차 (08/10 - 08/14)</span>
            <button type="button" id="btn-next-week" class="nav-btn" aria-label="다음 주">다음 주 &#9654;</button>
        </nav>
        <div class="header-actions">
            <button type="button" id="btn-today" class="btn btn-secondary">오늘</button>
            <button type="button" id="btn-add-schedule" class="btn btn-primary">+ 일정 등록</button>
            <button type="button" id="btn-manage-members" class="btn btn-secondary">팀원 관리</button>
        </div>
    </header>

    <!-- ===== Main Content ===== -->
    <main class="app-main">
        <!-- Schedule Grid: Weekly View (Mon-Fri) -->
        <section class="schedule-section" aria-label="주간 스케줄">
            <div class="schedule-grid-wrapper">
                <table class="schedule-grid" id="schedule-table">
                    <thead>
                        <tr>
                            <th class="col-member">팀원</th>
                            <th class="col-day" data-day="mon">월<br><span class="date-label" id="date-mon"></span></th>
                            <th class="col-day" data-day="tue">화<br><span class="date-label" id="date-tue"></span></th>
                            <th class="col-day" data-day="wed">수<br><span class="date-label" id="date-wed"></span></th>
                            <th class="col-day" data-day="thu">목<br><span class="date-label" id="date-thu"></span></th>
                            <th class="col-day" data-day="fri">금<br><span class="date-label" id="date-fri"></span></th>
                        </tr>
                    </thead>
                    <tbody id="schedule-body">
                        <!-- Rows dynamically generated by app.js -->
                        <!-- Example row structure:
                        <tr data-member-id="1">
                            <td class="col-member">
                                <span class="member-color" style="background-color: #4A90D9;"></span>
                                <span class="member-name">홍길동</span>
                            </td>
                            <td class="col-day status-office" data-date="2026-08-10" data-member="1">
                                <span class="status-badge">출근</span>
                            </td>
                            <td class="col-day status-remote" data-date="2026-08-11" data-member="1">
                                <span class="status-badge">재택</span>
                            </td>
                            <td class="col-day status-vacation" data-date="2026-08-12" data-member="1">
                                <span class="status-badge">휴가</span>
                            </td>
                            <td class="col-day status-office" data-date="2026-08-13" data-member="1">
                                <span class="status-badge">출근</span>
                            </td>
                            <td class="col-day status-trip" data-date="2026-08-14" data-member="1">
                                <span class="status-badge">출장</span>
                            </td>
                        </tr>
                        -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Legend -->
        <section class="legend-section" aria-label="범례">
            <h2 class="legend-title">범례</h2>
            <ul class="legend-list">
                <li class="legend-item">
                    <span class="legend-color status-office"></span>
                    <span class="legend-label">출근</span>
                </li>
                <li class="legend-item">
                    <span class="legend-color status-trip"></span>
                    <span class="legend-label">출장</span>
                </li>
                <li class="legend-item">
                    <span class="legend-color status-vacation"></span>
                    <span class="legend-label">휴가</span>
                </li>
                <li class="legend-item">
                    <span class="legend-color status-official"></span>
                    <span class="legend-label">공가</span>
                </li>
                <li class="legend-item">
                    <span class="legend-color status-remote"></span>
                    <span class="legend-label">재택</span>
                </li>
                <li class="legend-item">
                    <span class="legend-color status-training"></span>
                    <span class="legend-label">교육</span>
                </li>
            </ul>
        </section>
    </main>

    <!-- ===== Modal: 일정 등록/수정 ===== -->
    <div class="modal-overlay" id="modal-schedule" role="dialog" aria-modal="true" aria-labelledby="modal-schedule-title" hidden>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-schedule-title" class="modal-title">일정 등록</h2>
                <button type="button" class="modal-close" id="btn-close-schedule" aria-label="닫기">&times;</button>
            </div>
            <form id="form-schedule" class="modal-body">
                <div class="form-group">
                    <label for="schedule-member">팀원</label>
                    <select id="schedule-member" name="member" required>
                        <option value="">-- 선택 --</option>
                        <!-- Options populated by app.js -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="schedule-date">날짜</label>
                    <input type="date" id="schedule-date" name="date" required>
                </div>
                <div class="form-group">
                    <label for="schedule-end-date">종료일 (선택)</label>
                    <input type="date" id="schedule-end-date" name="endDate">
                </div>
                <div class="form-group">
                    <label for="schedule-status">상태</label>
                    <select id="schedule-status" name="status" required>
                        <option value="">-- 선택 --</option>
                        <option value="출근">출근</option>
                        <option value="출장">출장</option>
                        <option value="휴가">휴가</option>
                        <option value="공가">공가</option>
                        <option value="재택">재택</option>
                        <option value="교육">교육</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="schedule-note">비고</label>
                    <input type="text" id="schedule-note" name="note" placeholder="메모 (선택사항)">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">저장</button>
                    <button type="button" class="btn btn-secondary" id="btn-cancel-schedule">취소</button>
                    <button type="button" class="btn btn-danger" id="btn-delete-schedule" hidden>삭제</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== Modal: 팀원 관리 ===== -->
    <div class="modal-overlay" id="modal-members" role="dialog" aria-modal="true" aria-labelledby="modal-members-title" hidden>
        <div class="modal-content modal-content-wide">
            <div class="modal-header">
                <h2 id="modal-members-title" class="modal-title">팀원 관리</h2>
                <button type="button" class="modal-close" id="btn-close-members" aria-label="닫기">&times;</button>
            </div>
            <div class="modal-body">
                <!-- 팀원 목록 -->
                <div class="member-list-section">
                    <h3>등록된 팀원</h3>
                    <table class="member-list-table" id="member-list-table">
                        <thead>
                            <tr>
                                <th>이름</th>
                                <th>부서</th>
                                <th>색상</th>
                                <th>작업</th>
                            </tr>
                        </thead>
                        <tbody id="member-list-body">
                            <!-- Rows populated by app.js -->
                        </tbody>
                    </table>
                </div>

                <!-- 팀원 추가 -->
                <div class="member-add-section">
                    <h3>팀원 추가</h3>
                    <form id="form-add-member" class="form-inline">
                        <div class="form-group">
                            <label for="member-name">이름</label>
                            <input type="text" id="member-name" name="name" required placeholder="이름 입력">
                        </div>
                        <div class="form-group">
                            <label for="member-department">부서</label>
                            <input type="text" id="member-department" name="department" placeholder="부서명">
                        </div>
                        <div class="form-group">
                            <label for="member-color">색상</label>
                            <input type="color" id="member-color" name="color" value="#4A90D9">
                        </div>
                        <button type="submit" class="btn btn-primary">추가</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== Footer ===== -->
    <footer class="app-footer">
        <p>&copy; 2026 파트 스케줄표 | 팀 일정관리 시스템</p>
        <p class="footer-note">데이터는 브라우저 로컬 스토리지에 저장됩니다.</p>
    </footer>

    <!-- App Script -->
    <script src="app.js"></script>
</body>
</html>
